<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f4e9">
<title>Overview | Y.P.I.A. Care</title>
<link rel="preload" href="/static/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/caregiver.css">
<script>
  // Caregivers only: send everyone else where they belong before anything paints.
  (function () {
    var user = null;
    try { user = JSON.parse(localStorage.getItem("ypia_user") || "null"); } catch (e) {}
    if (!user) window.location.replace("/login");
    else if (user.role === "parent") window.location.replace("/parent");
  })();
</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="cg-header">
    <a class="cg-brand" href="#overview" aria-label="Y.P.I.A. Care overview">
      <span class="cg-brand-mark" aria-hidden="true"><svg class="icon"><use href="/static/icons/sprite.svg#i-heart-pulse"/></svg></span>
      <span class="word">Y.P.I.A</span>
    </a>

    <!-- Which parent's care is being viewed -->
    <button id="parentSwitch" class="parent-switch" type="button" aria-haspopup="dialog" disabled>
      <span id="parentAvatar" class="avatar avatar--parent" aria-hidden="true">–</span>
      <span class="parent-switch-text">
        <span class="parent-switch-label">Viewing care for</span>
        <span id="parentName" class="parent-switch-name">Loading…</span>
      </span>
      <svg id="parentChevron" class="icon icon-chev" aria-hidden="true" hidden><use href="/static/icons/sprite.svg#i-chevrons-up-down"/></svg>
    </button>

    <span class="header-spacer"></span>

    <!-- The signed-in caregiver -->
    <button id="profileButton" class="profile-btn" type="button" aria-haspopup="dialog">
      <span id="profileAvatar" class="avatar" aria-hidden="true">?</span>
      <span id="profileName" class="profile-name">Account</span>
      <svg class="icon icon-chev" aria-hidden="true" style="color:var(--muted);width:1.1rem;height:1.1rem"><use href="/static/icons/sprite.svg#i-chevron-down"/></svg>
    </button>
  </header>

  <div class="cg-shell">
    <aside class="cg-rail">
      <nav class="rail-nav" aria-label="Main">
        <ul>
          <li><a class="rail-link" href="#overview" data-route="overview"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-house"/></svg>Overview</a></li>
          <li><a class="rail-link" href="#tasks" data-route="tasks"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-list-checks"/></svg>Tasks<span id="navTaskCount" class="nav-count" hidden aria-label="open requests from your parent"></span></a></li>
          <li><a class="rail-link" href="#schedule" data-route="schedule"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-calendar-days"/></svg>Schedule</a></li>
          <li><a class="rail-link" href="#medications" data-route="medications"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-pill"/></svg>Medications</a></li>
          <li><a class="rail-link" href="#documents" data-route="documents"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-file-text"/></svg>Documents</a></li>
          <li><a class="rail-link" href="#changes" data-route="changes"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-history"/></svg>Changes</a></li>
          <li class="rail-sep rail-secondary" role="separator"></li>
          <li class="rail-secondary"><a class="rail-link" href="#notes" data-route="notes"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-notebook-pen"/></svg>Notes</a></li>
        </ul>
      </nav>

    </aside>

    <main id="main" class="cg-main">
      <section id="view-overview" class="view" data-view="overview" hidden></section>
      <section id="view-tasks" class="view" data-view="tasks" hidden></section>
      <section id="view-schedule" class="view" data-view="schedule" hidden></section>
      <section id="view-medications" class="view" data-view="medications" hidden></section>
      <section id="view-documents" class="view" data-view="documents" hidden></section>
      <section id="view-changes" class="view" data-view="changes" hidden></section>
      <section id="view-notes" class="view" data-view="notes" hidden></section>
      <p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p>
    </main>
  </div>

  <!-- Choose which linked parent to view -->
  <dialog id="parentDialog" aria-labelledby="parentDialogTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 class="dialog-title" id="parentDialogTitle">Whose care are you viewing?</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-x"/></svg></button>
      </div>
      <div id="parentChoices" class="choice-list" role="radiogroup" aria-labelledby="parentDialogTitle"></div>
    </div>
  </dialog>

  <!-- The signed-in caregiver -->
  <dialog id="profileDialog" aria-labelledby="profileDialogTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 class="dialog-title" id="profileDialogTitle">Your account</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-x"/></svg></button>
      </div>
      <div class="ov-id">
        <span id="profileDialogAvatar" class="avatar avatar--lg" aria-hidden="true">?</span>
        <div class="profile-lines">
          <p><strong id="profileDialogName" style="color:var(--ink)"></strong></p>
          <p id="profileDialogEmail"></p>
          <p>Caregiver account</p>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="logoutButton" class="btn btn-secondary" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-log-out"/></svg>Log out</button>
      </div>
    </div>
  </dialog>

  <!-- Document details (confirmed or awaiting confirmation) -->
  <dialog id="docDialog" class="wide" aria-labelledby="docDialogTitle">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 class="dialog-title" id="docDialogTitle">Document details</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="icon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-x"/></svg></button>
      </div>
      <div id="docDialogBody" class="extract"></div>
    </div>
  </dialog>

  <script type="module" src="/static/js/caregiver/app.js"></script>
</body>
</html>
