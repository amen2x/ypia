<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Home | Y.P.I.A</title>
<link rel="stylesheet" href="/static/parent.css">
</head>
<body>
  <header class="app-header">
    <span class="brand">Y.P.I.A</span>
    <button id="avatarButton" class="avatar-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
      <img id="avatarImage" class="avatar-image" src="/static/images/elderwoman.jpg" alt="">
      <span id="avatarInitials" class="avatar-initials" hidden></span>
    </button>
  </header>

  <div id="profileOverlay" class="profile-overlay" hidden></div>
  <div id="profilePanel" class="profile-panel" hidden role="dialog" aria-modal="true" aria-label="Profile">
    <div class="profile-panel-header">
      <img id="profileAvatarImage" class="profile-avatar-image" src="/static/images/elderwoman.jpg" alt="">
      <span id="profileAvatarInitials" class="avatar-initials" hidden></span>
      <div>
        <p class="profile-name" id="profileName">Parent</p>
        <p class="profile-email" id="profileEmail" hidden></p>
        <p class="profile-role">Parent account</p>
      </div>
    </div>
    <button id="logoutButton" class="profile-logout" type="button">Log out</button>
  </div>

  <main class="parent-main">
    <div class="greeting-block">
      <h1 class="greeting" id="greeting">Hi</h1>
      <p class="prompt">What can I help you with today?</p>
    </div>

    <div class="voice-hero">
      <button id="voiceButton" class="voice-orb" type="button" aria-label="Start voice conversation">
        <span class="orb-ring" aria-hidden="true"></span>
        <span class="orb-core" aria-hidden="true">🎤</span>
      </button>
      <p id="voiceStatus" class="voice-status" role="status" aria-live="polite">Tap to talk</p>
    </div>

    <section class="upload-card">
      <button id="uploadButton" class="upload-button" type="button" aria-label="Add a medical document">＋ Add medical document</button>
      <p class="upload-hint">Prescription, visit summary, appointment sheet, or other healthcare document</p>
      <div id="uploadToast" class="toast" role="status" aria-live="polite" hidden></div>
    </section>

    <a href="/static/games/index.html" class="games-link">🎲 Play games</a>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("ypia_user") || "null");
    if (!user) {
      window.location.replace("/login");
    } else if (user.role !== "parent") {
      window.location.replace("/");
    }

    const firstName = (user?.fullName || "").trim().split(" ")[0] || "there";

    function updateGreeting() {
      const hour = new Date().getHours();
      const period = hour < 12 ? "morning" : hour < 17 ? "afternoon" : "evening";
      const greetingEl = document.getElementById("greeting");
      if (greetingEl) greetingEl.textContent = `Good ${period}, ${firstName}`;
    }
    updateGreeting();
    setInterval(updateGreeting, 60000);

    function getInitials(fullName) {
      const parts = (fullName || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      return (parts[0][0] + (parts[1]?.[0] || "")).toUpperCase();
    }

    function setupAvatarFallback(imageId, initialsId) {
      const img = document.getElementById(imageId);
      const initials = document.getElementById(initialsId);
      if (!img || !initials) return;
      initials.textContent = getInitials(user?.fullName);
      img.addEventListener("error", () => {
        img.hidden = true;
        initials.hidden = false;
      }, { once: true });
    }
    setupAvatarFallback("avatarImage", "avatarInitials");
    setupAvatarFallback("profileAvatarImage", "profileAvatarInitials");

    const profileNameEl = document.getElementById("profileName");
    if (profileNameEl) profileNameEl.textContent = user?.fullName || "Parent";
    if (user?.email) {
      const profileEmailEl = document.getElementById("profileEmail");
      if (profileEmailEl) {
        profileEmailEl.textContent = user.email;
        profileEmailEl.hidden = false;
      }
    }

    const avatarButton = document.getElementById("avatarButton");
    const profilePanel = document.getElementById("profilePanel");
    const profileOverlay = document.getElementById("profileOverlay");

    function openProfilePanel() {
      profilePanel.hidden = false;
      profileOverlay.hidden = false;
      avatarButton.setAttribute("aria-expanded", "true");
    }
    function closeProfilePanel() {
      profilePanel.hidden = true;
      profileOverlay.hidden = true;
      avatarButton.setAttribute("aria-expanded", "false");
    }
    avatarButton.addEventListener("click", () => {
      if (profilePanel.hidden) openProfilePanel();
      else closeProfilePanel();
    });
    profileOverlay.addEventListener("click", closeProfilePanel);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !profilePanel.hidden) closeProfilePanel();
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("ypia_user");
      window.location.href = "/login";
    });

    const uploadToast = document.getElementById("uploadToast");
    let uploadToastTimer = null;
    function showUploadToast(message, isError) {
      uploadToast.textContent = message;
      uploadToast.classList.toggle("toast-error", Boolean(isError));
      uploadToast.hidden = false;
      clearTimeout(uploadToastTimer);
      uploadToastTimer = setTimeout(() => {
        uploadToast.hidden = true;
      }, isError ? 5000 : 4000);
    }

    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.accept = ".jpg,.jpeg,.png,.pdf";
    uploadInput.hidden = true;
    document.body.append(uploadInput);

    document.getElementById("uploadButton").addEventListener("click", () => {
      uploadInput.click();
    });

    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files?.[0];
      if (!file || !user?.id) return;

      showUploadToast("Uploading...", false);
      const formData = new FormData();
      formData.append("document", file);
      formData.append("userId", user.id);

      try {
        const response = await fetch("http://localhost:3000/api/documents", {
          method: "POST",
          body: formData,
        });
        if (response.ok) {
          showUploadToast("✓ Document added and shared with your caregiver", false);
        } else {
          showUploadToast("Could not process that document. Please try again.", true);
        }
      } catch {
        showUploadToast("Something went wrong. Please try again.", true);
      } finally {
        uploadInput.value = "";
      }
    });
  </script>

  <script type="module">
    import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.25.0/+esm";

    const voiceButton = document.getElementById("voiceButton");
    const voiceStatus = document.getElementById("voiceStatus");
    const user = JSON.parse(localStorage.getItem("ypia_user") || "null");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let conversation = null;
    let activeConversationId = null;
    let currentMode = "listening";
    let orbAnimationFrame = null;

    function setStatus(text) {
      voiceStatus.textContent = text;
    }

    // Reads real mic/agent loudness from the ElevenLabs session already
    // holding the microphone — no second getUserMedia call, no fake motion.
    function animateOrb() {
      let volume = 0;
      if (conversation) {
        try {
          volume = currentMode === "speaking" ? conversation.getOutputVolume() : conversation.getInputVolume();
        } catch {
          volume = 0;
        }
      }
      const clamped = Math.max(0, Math.min(1, volume || 0));
      const scale = prefersReducedMotion ? 1 : 1 + clamped * 0.16;
      voiceButton.style.setProperty("--orb-scale", scale.toFixed(3));
      orbAnimationFrame = requestAnimationFrame(animateOrb);
    }

    function startOrbAnimation() {
      if (orbAnimationFrame) return;
      orbAnimationFrame = requestAnimationFrame(animateOrb);
    }

    function stopOrbAnimation() {
      if (orbAnimationFrame) {
        cancelAnimationFrame(orbAnimationFrame);
        orbAnimationFrame = null;
      }
      voiceButton.style.removeProperty("--orb-scale");
    }

    function reset() {
      conversation = null;
      activeConversationId = null;
      stopOrbAnimation();
      voiceButton.classList.remove("is-connecting", "is-active", "is-speaking");
      voiceButton.disabled = false;
      setStatus("Tap to talk");
    }

    async function registerConversation(userId, conversationId) {
      try {
        await fetch("http://localhost:3000/api/parent/voice-conversations/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, conversationId }),
        });
      } catch {
        // Non-fatal: the conversation can still be synced later if this retries.
      }
    }

    async function syncConversation(userId, conversationId) {
      try {
        await fetch("http://localhost:3000/api/parent/voice-conversations/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, conversationId }),
        });
      } catch {
        // Non-fatal: the conversation mapping is already saved and can be retried later.
      }
    }

    async function startConversation() {
      voiceButton.disabled = true;
      voiceButton.classList.add("is-connecting");
      setStatus("Connecting...");

      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        voiceButton.disabled = false;
        voiceButton.classList.remove("is-connecting");
        setStatus("Microphone access denied");
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/api/elevenlabs/signed-url");
        if (!response.ok) throw new Error("signed-url request failed");
        const { signedUrl } = await response.json();

        conversation = await Conversation.startSession({
          signedUrl,
          dynamicVariables: {
            user_id: user?.id ?? "",
            parent_name: user?.fullName ?? "",
          },
          clientTools: {
            get_next_appointment: async () => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }

              try {
                const apiResponse = await fetch(
                  `http://localhost:3000/api/parent/next-appointment?userId=${encodeURIComponent(user.id)}`
                );
                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not retrieve appointment information right now." };
                }

                const data = await apiResponse.json();
                if (!data.appointment) {
                  return { status: "none", message: "No upcoming appointment is currently recorded." };
                }

                return { status: "ok", appointment: data.appointment };
              } catch {
                return { status: "error", message: "Could not retrieve appointment information right now." };
              }
            },
            get_current_medications: async () => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }

              try {
                const apiResponse = await fetch(
                  `http://localhost:3000/api/parent/current-medications?userId=${encodeURIComponent(user.id)}`
                );
                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not retrieve medication information right now." };
                }

                const data = await apiResponse.json();
                if (!data.medications || data.medications.length === 0) {
                  return { status: "none", message: "No active medications are currently recorded." };
                }

                return { status: "ok", medications: data.medications };
              } catch {
                return { status: "error", message: "Could not retrieve medication information right now." };
              }
            },
            get_latest_changes: async () => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }

              try {
                const apiResponse = await fetch(
                  `http://localhost:3000/api/parent/latest-changes?userId=${encodeURIComponent(user.id)}`
                );
                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not retrieve recent changes right now." };
                }

                const data = await apiResponse.json();
                if (data.status === "not_enough_history") {
                  return { status: "none", message: "There isn't enough document history yet to compare changes." };
                }
                if (data.status === "malformed_history") {
                  return { status: "error", message: "Recent records could not be compared right now." };
                }
                if (data.status === "no_changes" || !data.changes || data.changes.length === 0) {
                  return { status: "none", message: "No changes were found between your two most recent records." };
                }

                return { status: "ok", changes: data.changes };
              } catch {
                return { status: "error", message: "Could not retrieve recent changes right now." };
              }
            },
            get_parent_background: async () => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }

              try {
                const apiResponse = await fetch(
                  `http://localhost:3000/api/parent/background?userId=${encodeURIComponent(user.id)}`
                );
                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not retrieve background information right now." };
                }

                const data = await apiResponse.json();
                if (data.status !== "ok" || !data.background) {
                  return { status: "none", message: "Y.P.I.A does not currently have background information for you." };
                }

                return { status: "ok", name: data.name, background: data.background };
              } catch {
                return { status: "error", message: "Could not retrieve background information right now." };
              }
            },
            get_parent_schedule: async ({ range } = {}) => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }

              const allowedRanges = ["today", "tomorrow", "week", "upcoming"];
              if (!allowedRanges.includes(range)) {
                return { status: "error", message: "range must be one of: today, tomorrow, week, upcoming." };
              }

              let timezone = "America/Chicago";
              try {
                timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || timezone;
              } catch {
                // Keep the fallback.
              }

              try {
                const apiResponse = await fetch(
                  `http://localhost:3000/api/parent/schedule?userId=${encodeURIComponent(user.id)}&range=${encodeURIComponent(range)}&timezone=${encodeURIComponent(timezone)}`
                );
                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not retrieve schedule information right now." };
                }

                const data = await apiResponse.json();
                if (!data.events || data.events.length === 0) {
                  return { status: "none", message: "No schedule events were found for that time range.", range };
                }

                return { status: "ok", range, events: data.events };
              } catch {
                return { status: "error", message: "Could not retrieve schedule information right now." };
              }
            },
            create_caregiver_action: async ({ text } = {}) => {
              if (!user?.id) {
                return { status: "error", message: "No logged-in parent found." };
              }
              if (!text || typeof text !== "string" || !text.trim()) {
                return { status: "error", message: "No request text was provided." };
              }

              try {
                const apiResponse = await fetch("http://localhost:3000/api/parent/caregiver-actions", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    userId: user.id,
                    text: text.trim(),
                    conversationId: activeConversationId,
                  }),
                });

                if (!apiResponse.ok) {
                  return { status: "error", message: "Could not send that request to your caregiver right now." };
                }

                return { status: "ok" };
              } catch {
                return { status: "error", message: "Could not send that request to your caregiver right now." };
              }
            },
          },
          onConnect: ({ conversationId }) => {
            activeConversationId = conversationId;
            currentMode = "listening";
            voiceButton.classList.remove("is-connecting");
            voiceButton.classList.add("is-active");
            setStatus("Tap to end");
            startOrbAnimation();
            if (user?.id && conversationId) {
              registerConversation(user.id, conversationId);
            }
          },
          onDisconnect: reset,
          onModeChange: ({ mode }) => {
            currentMode = mode;
            voiceButton.classList.toggle("is-speaking", mode === "speaking");
            setStatus(mode === "speaking" ? "Speaking..." : "Listening...");
          },
          onError: () => {
            voiceButton.disabled = false;
            voiceButton.classList.remove("is-connecting", "is-active", "is-speaking");
            stopOrbAnimation();
            setStatus("Connection failed. Tap to retry.");
            conversation = null;
          },
        });

        voiceButton.disabled = false;
      } catch {
        voiceButton.disabled = false;
        voiceButton.classList.remove("is-connecting", "is-active", "is-speaking");
        stopOrbAnimation();
        setStatus("Connection failed. Tap to retry.");
        conversation = null;
      }
    }

    async function endConversation() {
      voiceButton.disabled = true;
      const conversationIdToSync = activeConversationId;
      try {
        await conversation?.endSession();
      } finally {
        reset();
        if (user?.id && conversationIdToSync) {
          syncConversation(user.id, conversationIdToSync);
        }
      }
    }

    voiceButton.addEventListener("click", () => {
      if (conversation) {
        endConversation();
      } else {
        startConversation();
      }
    });
  </script>
</body>
</html>
